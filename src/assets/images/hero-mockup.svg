<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="A website shown on a laptop and a phone">
  <defs>
    <clipPath id="screenClip"><rect x="88" y="78" width="560" height="322" rx="4"/></clipPath>
    <clipPath id="phoneClip"><rect x="596" y="228" width="150" height="256" rx="18"/></clipPath>
  </defs>

  <!-- Soft background shape — keeps the composition from floating in white -->
  <circle cx="620" cy="130" r="150" fill="#DDE8DD" opacity="0.55"/>
  <circle cx="150" cy="400" r="95" fill="#EEEEEE" opacity="0.8"/>

  <!-- ================= LAPTOP ================= -->
  <rect x="80" y="56" width="576" height="352" rx="12" fill="#FFFFFF" stroke="#CECECE" stroke-width="2"/>

  <!-- Browser chrome -->
  <path d="M80 68a12 12 0 0 1 12-12h552a12 12 0 0 1 12 12v22H80z" fill="#F8F8F8"/>
  <circle cx="103" cy="73" r="4.5" fill="#CECECE"/>
  <circle cx="119" cy="73" r="4.5" fill="#CECECE"/>
  <circle cx="135" cy="73" r="4.5" fill="#CECECE"/>
  <rect x="156" y="66" width="200" height="14" rx="7" fill="#EEEEEE"/>
  <line x1="80" y1="90" x2="656" y2="90" stroke="#CECECE" stroke-width="1.5"/>

  <g clip-path="url(#screenClip)">
    <rect x="88" y="90" width="560" height="310" fill="#FFFFFF"/>

    <!-- Site header -->
    <circle cx="116" cy="112" r="4" fill="#748F74"/>
    <rect x="128" y="107" width="54" height="10" rx="5" fill="#0E1216"/>
    <rect x="330" y="108" width="34" height="8" rx="4" fill="#CECECE"/>
    <rect x="374" y="108" width="34" height="8" rx="4" fill="#CECECE"/>
    <rect x="418" y="108" width="34" height="8" rx="4" fill="#CECECE"/>
    <rect x="556" y="103" width="62" height="19" rx="9.5" fill="#748F74"/>

    <!-- Hero block -->
    <rect x="212" y="152" width="312" height="20" rx="10" fill="#0E1216"/>
    <rect x="248" y="182" width="240" height="20" rx="10" fill="#0E1216"/>
    <rect x="268" y="214" width="200" height="9" rx="4.5" fill="#81878C"/>
    <rect x="296" y="230" width="144" height="9" rx="4.5" fill="#81878C"/>
    <rect x="292" y="256" width="72" height="24" rx="12" fill="#748F74"/>
    <rect x="374" y="256" width="72" height="24" rx="12" fill="#FFFFFF" stroke="#CECECE" stroke-width="1.5"/>

    <!-- Three cards -->
    <g>
      <rect x="128" y="312" width="152" height="86" rx="8" fill="#F8F8F8" stroke="#EEEEEE" stroke-width="1.5"/>
      <rect x="144" y="328" width="30" height="30" rx="8" fill="#C2D3C2"/>
      <rect x="144" y="368" width="104" height="8" rx="4" fill="#CECECE"/>
      <rect x="144" y="382" width="72" height="8" rx="4" fill="#EEEEEE"/>
    </g>
    <g>
      <rect x="292" y="312" width="152" height="86" rx="8" fill="#F8F8F8" stroke="#EEEEEE" stroke-width="1.5"/>
      <rect x="308" y="328" width="30" height="30" rx="8" fill="#C2D3C2"/>
      <rect x="308" y="368" width="104" height="8" rx="4" fill="#CECECE"/>
      <rect x="308" y="382" width="72" height="8" rx="4" fill="#EEEEEE"/>
    </g>
    <g>
      <rect x="456" y="312" width="152" height="86" rx="8" fill="#F8F8F8" stroke="#EEEEEE" stroke-width="1.5"/>
      <rect x="472" y="328" width="30" height="30" rx="8" fill="#C2D3C2"/>
      <rect x="472" y="368" width="104" height="8" rx="4" fill="#CECECE"/>
      <rect x="472" y="382" width="72" height="8" rx="4" fill="#EEEEEE"/>
    </g>
  </g>

  <!-- Laptop base -->
  <path d="M40 408h656l16 22H24z" fill="#F8F8F8" stroke="#CECECE" stroke-width="2" stroke-linejoin="round"/>
  <rect x="330" y="414" width="76" height="5" rx="2.5" fill="#CECECE"/>

  <!-- ================= PHONE ================= -->
  <rect x="590" y="222" width="162" height="268" rx="24" fill="#FFFFFF" stroke="#CECECE" stroke-width="2"/>
  <g clip-path="url(#phoneClip)">
    <rect x="596" y="228" width="150" height="256" fill="#FFFFFF"/>
    <rect x="596" y="228" width="150" height="34" fill="#F8F8F8"/>
    <circle cx="616" cy="245" r="3.5" fill="#748F74"/>
    <rect x="626" y="241" width="40" height="8" rx="4" fill="#0E1216"/>
    <rect x="716" y="238" width="18" height="14" rx="4" fill="#748F74"/>

    <rect x="620" y="284" width="102" height="12" rx="6" fill="#0E1216"/>
    <rect x="634" y="304" width="74" height="12" rx="6" fill="#0E1216"/>
    <rect x="628" y="328" width="86" height="7" rx="3.5" fill="#81878C"/>
    <rect x="642" y="342" width="58" height="7" rx="3.5" fill="#81878C"/>
    <rect x="634" y="364" width="74" height="22" rx="11" fill="#748F74"/>

    <rect x="616" y="404" width="110" height="30" rx="7" fill="#F8F8F8" stroke="#EEEEEE" stroke-width="1.5"/>
    <rect x="616" y="444" width="110" height="30" rx="7" fill="#F8F8F8" stroke="#EEEEEE" stroke-width="1.5"/>
  </g>
  <rect x="646" y="232" width="50" height="7" rx="3.5" fill="#EEEEEE"/>

  <!-- WhatsApp-style floating bubble, mirroring the real site -->
  <circle cx="726" cy="452" r="21" fill="#748F74"/>
  <path d="M726 441c-6.1 0-11 4.9-11 11 0 1.9.5 3.7 1.4 5.3l-1.5 5.4 5.6-1.5c1.5.8 3.2 1.3 5 1.3h.5c6.1 0 11-4.9 11-11s-4.9-11-11-11zm6.4 15.5c-.3.8-1.6 1.5-2.2 1.6-.6.1-1.3.1-2-.1-.5-.2-1.1-.4-1.9-.7-3.3-1.4-5.5-4.8-5.7-5-.2-.2-1.4-1.8-1.4-3.5s.9-2.5 1.2-2.8c.3-.3.6-.4.9-.4h.6c.2 0 .5-.1.8.6.3.7 1 2.4 1.1 2.6.1.2.1.4 0 .6-.1.2-.2.4-.3.5-.2.2-.3.4-.5.6-.2.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.3.1.5.1.7-.1.2-.2.8-.9 1-1.2.2-.3.4-.2.7-.1.3.1 1.9.9 2.2 1.1.3.2.5.2.6.3.1.2.1.7-.2 1.5z" fill="#FFFFFF"/>
</svg>
