server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Emit relative Location headers. Without this, nginx's trailing-slash
  # redirect for /about rebuilds an absolute URL and loses the published
  # port, sending the browser to http://localhost/about/ instead of :8080.
  absolute_redirect off;

  # Astro builds directory-style routes: /pricing -> /pricing/index.html
  # The Next.js demo exports /demos/cafe/menu as menu.html next to a menu/
  # folder, so .html has to be tried before the folder.
  location / {
    try_files $uri $uri.html $uri/ =404;
  }

  # Hashed build assets — the filename changes whenever the content does,
  # so they're safe to cache forever.
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
  }

  # HTML must always be revalidated so a redeploy is picked up immediately.
  location ~* \.html$ {
    add_header Cache-Control "no-cache";
  }

  gzip on;
  gzip_vary on;
  gzip_min_length 256;
  gzip_types text/plain text/css application/javascript application/json
             image/svg+xml application/xml font/woff2;

  # Add src/pages/404.astro to the project, then uncomment to serve it.
  # error_page 404 /404.html;
}
